<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210">
  <defs>
    <linearGradient id="gh-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282828"/>
      <stop offset="50%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gh-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
    <linearGradient id="gh-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="85%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.2)"/>
    </linearGradient>
    <linearGradient id="gh-camera-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e1e"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <filter id="gh-shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="rgba(0,0,0,0.75)"/>
    </filter>
  </defs>
  <rect x="5" y="8" width="90" height="200" rx="18" fill="rgba(0,0,0,0.5)" filter="url(#gh-shadow)"/>
  <!-- Space Black — ultra premium -->
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#gh-frame)"/>
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#gh-highlight)"/>
  <!-- Subtle top edge -->
  <line x1="18" y1="1.5" x2="82" y2="1.5" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="5" y="14" width="90" height="180" rx="14" fill="#030303"/>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#gh-screen)"/>
  <!-- Ultra subtle glow — very minimal on space black -->
  <radialGradient id="gh-glow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="rgba(255,255,255,0.03)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#gh-glow)"/>
  <!-- Grid -->
  <line x1="6" y1="74" x2="94" y2="74" stroke="rgba(255,255,255,0.05)" stroke-width="0.6"/>
  <line x1="6" y1="134" x2="94" y2="134" stroke="rgba(255,255,255,0.05)" stroke-width="0.6"/>
  <line x1="35" y1="15" x2="35" y2="193" stroke="rgba(255,255,255,0.05)" stroke-width="0.6"/>
  <line x1="65" y1="15" x2="65" y2="193" stroke="rgba(255,255,255,0.05)" stroke-width="0.6"/>
  <!-- Focus ring — bright gold on space black = max contrast -->
  <circle cx="50" cy="104" r="15" fill="none" stroke="rgba(245,197,24,0.7)" stroke-width="1.4"/>
  <line x1="35" y1="104" x2="38.5" y2="104" stroke="rgba(245,197,24,0.95)" stroke-width="1.4"/>
  <line x1="61.5" y1="104" x2="65" y2="104" stroke="rgba(245,197,24,0.95)" stroke-width="1.4"/>
  <line x1="50" y1="89" x2="50" y2="92.5" stroke="rgba(245,197,24,0.95)" stroke-width="1.4"/>
  <line x1="50" y1="115.5" x2="50" y2="119" stroke="rgba(245,197,24,0.95)" stroke-width="1.4"/>
  <!-- REC -->
  <circle cx="82" cy="28" r="3.5" fill="#e05252"/>
  <circle cx="82" cy="28" r="5.5" fill="none" stroke="rgba(224,82,82,0.35)" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="12" y="28" font-family="monospace" font-size="5.5" fill="rgba(245,197,24,0.8)" letter-spacing="0.3">ISO</text>
  <text x="12" y="36" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">100</text>
  <text x="12" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.38)">180°</text>
  <text x="62" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.38)">24fps</text>
  <!-- Dynamic Island -->
  <rect x="34" y="16" width="32" height="10" rx="5" fill="#030303"/>
  <!-- Volume left -->
  <rect x="-1" y="48" width="2.5" height="10" rx="1" fill="#202020"/>
  <rect x="-1" y="64" width="2.5" height="22" rx="1" fill="#202020"/>
  <rect x="-1" y="90" width="2.5" height="22" rx="1" fill="#202020"/>
  <!-- Power + Camera Control right -->
  <rect x="98.5" y="60" width="2.5" height="26" rx="1" fill="#222222"/>
  <rect x="98.5" y="96" width="2.5" height="36" rx="1.2" fill="#252525"/>
  <rect x="98.5" y="97" width="2.5" height="34" rx="1.1" fill="rgba(245,197,24,0.18)"/>
  <!-- USB-C bottom -->
  <rect x="40" y="200" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.08)"/>
  <!-- iPhone 17 label -->
  <text x="50" y="182" font-family="monospace" font-size="4.5" fill="rgba(255,255,255,0.22)" text-anchor="middle">iPhone 17 Pro</text>
</svg>
