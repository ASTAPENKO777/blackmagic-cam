<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210">
  <defs>
    <linearGradient id="ge-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1f6e"/>
      <stop offset="50%" stop-color="#261248"/>
      <stop offset="100%" stop-color="#160a2c"/>
    </linearGradient>
    <linearGradient id="ge-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d080f"/>
      <stop offset="100%" stop-color="#070408"/>
    </linearGradient>
    <linearGradient id="ge-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.18)"/>
    </linearGradient>
    <filter id="ge-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
  </defs>
  <rect x="5" y="8" width="90" height="200" rx="18" fill="rgba(0,0,0,0.4)" filter="url(#ge-shadow)"/>
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#ge-frame)"/>
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#ge-highlight)"/>
  <line x1="18" y1="1" x2="82" y2="1" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="5" y="14" width="90" height="180" rx="14" fill="#05030a"/>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#ge-screen)"/>
  <!-- Purple glow stronger -->
  <radialGradient id="ge-glow" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="rgba(150,80,240,0.1)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#ge-glow)"/>
  <!-- Grid -->
  <line x1="6" y1="74" x2="94" y2="74" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="6" y1="134" x2="94" y2="134" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="35" y1="15" x2="35" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="65" y1="15" x2="65" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <!-- Focus ring gold -->
  <circle cx="50" cy="104" r="15" fill="none" stroke="rgba(245,197,24,0.55)" stroke-width="1.2"/>
  <line x1="35" y1="104" x2="38.5" y2="104" stroke="rgba(245,197,24,0.8)" stroke-width="1.2"/>
  <line x1="61.5" y1="104" x2="65" y2="104" stroke="rgba(245,197,24,0.8)" stroke-width="1.2"/>
  <line x1="50" y1="89" x2="50" y2="92.5" stroke="rgba(245,197,24,0.8)" stroke-width="1.2"/>
  <line x1="50" y1="115.5" x2="50" y2="119" stroke="rgba(245,197,24,0.8)" stroke-width="1.2"/>
  <!-- REC -->
  <circle cx="82" cy="28" r="3.5" fill="#e05252"/>
  <circle cx="82" cy="28" r="5.5" fill="none" stroke="rgba(224,82,82,0.3)" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="12" y="28" font-family="monospace" font-size="5.5" fill="rgba(200,140,255,0.7)" letter-spacing="0.3">ISO</text>
  <text x="12" y="36" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">100</text>
  <text x="12" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">180°</text>
  <text x="62" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">24fps</text>
  <!-- Dynamic Island (pill) — new in 14 Pro -->
  <rect x="34" y="16" width="32" height="10" rx="5" fill="#05030a"/>
  <!-- Buttons -->
  <rect x="-1" y="48" width="2.5" height="10" rx="1" fill="#3d1f6e"/>
  <rect x="-1" y="64" width="2.5" height="22" rx="1" fill="#3d1f6e"/>
  <rect x="-1" y="90" width="2.5" height="22" rx="1" fill="#3d1f6e"/>
  <rect x="98.5" y="72" width="2.5" height="26" rx="1" fill="#3d1f6e"/>
  <rect x="36" y="200" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <text x="50" y="182" font-family="monospace" font-size="4.5" fill="rgba(255,255,255,0.18)" text-anchor="middle">iPhone 14 Pro</text>
</svg>
