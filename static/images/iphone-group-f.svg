<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210">
  <defs>
    <linearGradient id="gf-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a8d7e"/>
      <stop offset="40%" stop-color="#7a6e60"/>
      <stop offset="100%" stop-color="#4a4038"/>
    </linearGradient>
    <linearGradient id="gf-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0906"/>
      <stop offset="100%" stop-color="#060504"/>
    </linearGradient>
    <linearGradient id="gf-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="20%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="80%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.22)"/>
    </linearGradient>
    <filter id="gf-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.65)"/>
    </filter>
  </defs>
  <rect x="5" y="8" width="90" height="200" rx="18" fill="rgba(0,0,0,0.4)" filter="url(#gf-shadow)"/>
  <!-- Natural Titanium frame -->
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#gf-frame)"/>
  <rect x="1" y="1" width="98" height="208" rx="18" fill="url(#gf-highlight)"/>
  <line x1="18" y1="1" x2="82" y2="1" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="5" y="14" width="90" height="180" rx="14" fill="#050403"/>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#gf-screen)"/>
  <!-- Warm glow -->
  <radialGradient id="gf-glow" cx="50%" cy="50%" r="45%">
    <stop offset="0%" stop-color="rgba(200,160,80,0.06)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
  </radialGradient>
  <rect x="6" y="15" width="88" height="178" rx="13" fill="url(#gf-glow)"/>
  <!-- Grid -->
  <line x1="6" y1="74" x2="94" y2="74" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="6" y1="134" x2="94" y2="134" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="35" y1="15" x2="35" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="65" y1="15" x2="65" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <!-- Focus ring warm gold -->
  <circle cx="50" cy="104" r="15" fill="none" stroke="rgba(245,197,24,0.6)" stroke-width="1.2"/>
  <line x1="35" y1="104" x2="38.5" y2="104" stroke="rgba(245,197,24,0.85)" stroke-width="1.2"/>
  <line x1="61.5" y1="104" x2="65" y2="104" stroke="rgba(245,197,24,0.85)" stroke-width="1.2"/>
  <line x1="50" y1="89" x2="50" y2="92.5" stroke="rgba(245,197,24,0.85)" stroke-width="1.2"/>
  <line x1="50" y1="115.5" x2="50" y2="119" stroke="rgba(245,197,24,0.85)" stroke-width="1.2"/>
  <!-- REC -->
  <circle cx="82" cy="28" r="3.5" fill="#e05252"/>
  <circle cx="82" cy="28" r="5.5" fill="none" stroke="rgba(224,82,82,0.3)" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="12" y="28" font-family="monospace" font-size="5.5" fill="rgba(245,197,24,0.7)" letter-spacing="0.3">ISO</text>
  <text x="12" y="36" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">100</text>
  <text x="12" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">180°</text>
  <text x="62" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">24fps</text>
  <!-- Dynamic Island -->
  <rect x="34" y="16" width="32" height="10" rx="5" fill="#050403"/>
  <!-- Titanium buttons -->
  <rect x="-1" y="48" width="2.5" height="10" rx="1" fill="#7a6e60"/>
  <rect x="-1" y="64" width="2.5" height="22" rx="1" fill="#7a6e60"/>
  <rect x="-1" y="90" width="2.5" height="22" rx="1" fill="#7a6e60"/>
  <rect x="98.5" y="72" width="2.5" height="26" rx="1" fill="#7a6e60"/>
  <!-- USB-C indicator (bottom — wider port, no Lightning notch) -->
  <rect x="40" y="200" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
  <text x="50" y="182" font-family="monospace" font-size="4.5" fill="rgba(255,255,255,0.2)" text-anchor="middle">iPhone 15 Pro</text>
</svg>
