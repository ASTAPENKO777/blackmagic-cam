<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 210">
  <defs>
    <linearGradient id="gb-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223a2a"/>
      <stop offset="50%" stop-color="#162618"/>
      <stop offset="100%" stop-color="#0d1810"/>
    </linearGradient>
    <linearGradient id="gb-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#091410"/>
      <stop offset="100%" stop-color="#040908"/>
    </linearGradient>
    <linearGradient id="gb-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="75%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.13)"/>
    </linearGradient>
    <filter id="gb-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>
  <rect x="5" y="8" width="90" height="200" rx="22" fill="rgba(0,0,0,0.35)" filter="url(#gb-shadow)"/>
  <rect x="1" y="1" width="98" height="208" rx="22" fill="url(#gb-frame)"/>
  <rect x="1" y="1" width="98" height="208" rx="22" fill="url(#gb-highlight)"/>
  <rect x="5" y="14" width="90" height="180" rx="16" fill="#030706"/>
  <rect x="6" y="15" width="88" height="178" rx="15" fill="url(#gb-screen)"/>
  <!-- Grid -->
  <line x1="6" y1="74" x2="94" y2="74" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="6" y1="134" x2="94" y2="134" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="35" y1="15" x2="35" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <line x1="65" y1="15" x2="65" y2="193" stroke="rgba(255,255,255,0.04)" stroke-width="0.6"/>
  <!-- Focus ring — green tint -->
  <circle cx="50" cy="104" r="15" fill="none" stroke="rgba(80,200,120,0.5)" stroke-width="1.2"/>
  <line x1="35" y1="104" x2="38.5" y2="104" stroke="rgba(80,200,120,0.75)" stroke-width="1.2"/>
  <line x1="61.5" y1="104" x2="65" y2="104" stroke="rgba(80,200,120,0.75)" stroke-width="1.2"/>
  <line x1="50" y1="89" x2="50" y2="92.5" stroke="rgba(80,200,120,0.75)" stroke-width="1.2"/>
  <line x1="50" y1="115.5" x2="50" y2="119" stroke="rgba(80,200,120,0.75)" stroke-width="1.2"/>
  <!-- REC -->
  <circle cx="82" cy="28" r="3.5" fill="#e05252"/>
  <circle cx="82" cy="28" r="5.5" fill="none" stroke="rgba(224,82,82,0.3)" stroke-width="0.8"/>
  <!-- Labels -->
  <text x="12" y="28" font-family="monospace" font-size="5.5" fill="rgba(80,200,120,0.7)" letter-spacing="0.3">ISO</text>
  <text x="12" y="36" font-family="monospace" font-size="6.5" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">200</text>
  <text x="12" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">180°</text>
  <text x="62" y="186" font-family="monospace" font-size="5" fill="rgba(255,255,255,0.3)">24fps</text>
  <!-- Notch -->
  <rect x="28" y="14" width="44" height="14" rx="7" fill="#0d1810"/>
  <!-- Buttons -->
  <rect x="-1" y="48" width="2.5" height="10" rx="1.2" fill="#2a4a30"/>
  <rect x="-1" y="64" width="2.5" height="22" rx="1.2" fill="#2a4a30"/>
  <rect x="-1" y="90" width="2.5" height="22" rx="1.2" fill="#2a4a30"/>
  <rect x="98.5" y="72" width="2.5" height="26" rx="1.2" fill="#2a4a30"/>
  <rect x="36" y="200" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.07)"/>
  <text x="50" y="182" font-family="monospace" font-size="4.5" fill="rgba(255,255,255,0.18)" text-anchor="middle">iPhone 11</text>
</svg>
